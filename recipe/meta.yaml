{% set name = "scinumtools3" %}
{% set version = "0.9.14" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/vrtulka23/scinumtools3/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 865f770f7a760cc7167e113167a59567ba6d582c5c31dbc9344488848139b8a6
  - url: https://github.com/vrtulka23/briefpp/archive/624aa478149a0fa0e7213bb7cfb6d19615d6e771.tar.gz
    sha256: aaac2a8a25f8a7bc11546038594eb9fef43bf560c0c0532a886c432d5e14de31
    folder: external/briefpp

build:
  number: 0
  script:
    # Unix
    - export CMAKE_BUILD_PARALLEL_LEVEL=1  # [unix]
    - export CMAKE_GENERATOR=Ninja  # [unix]

    # Build and install
    - {{ PYTHON }} -m pip install . --no-deps -vv --config-settings=cmake.define.ENABLE_UNIT_TESTS=ON --config-settings=cmake.define.ENABLE_SNT_REPORT=ON --config-settings="cmake.define.SNT_BRIEFPP_INCLUDE_DIR=${SRC_DIR}/external/briefpp/include" --config-settings=build-dir=build  # [unix]
    - {{ PYTHON }} -m pip install . --no-deps -vv --config-settings=cmake.define.ENABLE_UNIT_TESTS=ON --config-settings=cmake.define.ENABLE_SNT_REPORT=ON --config-settings="cmake.define.SNT_BRIEFPP_INCLUDE_DIR=%SRC_DIR%\external\briefpp\include" --config-settings=build-dir=build  # [win]

    # Run CTest
    - ctest --test-dir build --output-on-failure  # [unix]
    - ctest --test-dir build -C Release --output-on-failure -V  # [win]
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake >=3.24
    - ninja
    - pytest
  host:
    - python
    - pip
    - pytest
    - scikit-build-core
    - pybind11
    - gtest
    - hdf5
    - numpy
  run:
    - python
    - numpy

test:
  imports:
    - scinumtools3
  commands:
    - python -c "from scinumtools3.dip import Environment, ReportFormat; assert ReportFormat is not None and hasattr(Environment, 'generate_report')"

about:
  home: https://github.com/vrtulka23/scinumtools3
  summary: Python bindings for the SciNumTools3 C++ numerical library.
  license: MIT
  license_file:
    - LICENSE
    - external/briefpp/LICENSE

extra:
  recipe-maintainers:
    - vrtulka23
